x-saas-env: &saas-env
  APP_ENV: ${APP_ENV:-development}
  SERVICE_MODE: ${SERVICE_MODE:-managed_saas}
  TENANCY_MODE: ${TENANCY_MODE:-multi_tenant}
  USER_SEGMENTS: ${USER_SEGMENTS:-developer,trader,regular}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-rust-env: &rust-env
  <<: *saas-env
  RUST_LOG: ${RUST_LOG:-debug}
  TRADING_ENV: ${TRADING_ENV:-sandbox}
  METRICS_HOST: ${METRICS_HOST:-0.0.0.0}
  ALPACA_API_KEY: ${ALPACA_API_KEY:-}
  ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
  APCA_API_KEY_ID: ${ALPACA_API_KEY:-}
  APCA_API_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
  ALPACA_PAPER_API_KEY: ${ALPACA_PAPER_API_KEY:-}
  ALPACA_PAPER_SECRET_KEY: ${ALPACA_PAPER_SECRET_KEY:-}
  ALPACA_LIVE_API_KEY: ${ALPACA_LIVE_API_KEY:-}
  ALPACA_LIVE_SECRET_KEY: ${ALPACA_LIVE_SECRET_KEY:-}
  MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  QUANTANT_NATS_ADDRESS: ${QUANTANT_NATS_ADDRESS:-nats://nats:4222}
  QUANTANT_ASSET_CLASS: ${QUANTANT_ASSET_CLASS:-us_equity}
  QUANTANT_MARKET_DATA_PROVIDER: ${QUANTANT_MARKET_DATA_PROVIDER:-alpaca}
  QUANTANT_EXECUTION_DELIVERY_SUBJECT: ${QUANTANT_EXECUTION_DELIVERY_SUBJECT:-quantant.execution.delivery}
  GO_CONTROL_PLANE_URL: ${GO_CONTROL_PLANE_URL:-http://gateway:8081}
  LEPOS_INTERNAL_API_KEY: ${LEPOS_INTERNAL_API_KEY:-}
  TELEMETRY_API_KEY: ${TELEMETRY_API_KEY:-}
  OBSERVABILITY_DUCKDB_PATH: ${OBSERVABILITY_DUCKDB_PATH:-/data/observability.duckdb}

x-rust-service: &rust-service
  restart: unless-stopped
  init: true
  networks:
    - private
  volumes:
    - type: bind
      source: ./config/${TRADING_CONFIG_PROFILE:-system.json}
      target: /workspace/ops/config/system.json
      read_only: true
    - type: bind
      source: ./config/risk_limits.toml
      target: /workspace/ops/config/risk_limits.toml
      read_only: true
  stop_grace_period: 30s
  deploy:
    resources:
      limits:
        cpus: '0.6'
        memory: 512M
      reservations:
        cpus: '0.15'
        memory: 320M

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - private
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  questdb:
    image: questdb/questdb:9.4.3
    restart: unless-stopped
    networks:
      - private
    volumes:
      - questdb-data:/var/lib/questdb
      - type: bind
        source: ./scripts/questdb/init.sql
        target: /var/lib/questdb/init.sql
        read_only: true
    environment:
      QDB_LOG_W_STDOUT_LEVEL: ERROR
      QDB_PG_USER: admin
      QDB_PG_PASSWORD: ${QUESTDB_PASSWORD:-quest}
      QDB_TELEMETRY_ENABLED: "false"
      QDB_LINE_TCP_NET_BIND_TO: 0.0.0.0:9009
      QDB_PG_NET_BIND_TO: 0.0.0.0:8812
      QDB_HTTP_BIND_TO: 0.0.0.0:9000
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9003/status >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3072M
        reservations:
          cpus: '0.4'
          memory: 1536M
    labels:
      com.rustalgorithmtrading.role: private-timeseries-db
      com.rustalgorithmtrading.audience: internal

  questdb-schema-init:
    image: postgres:alpine
    networks:
      - private
    volumes:
      - ./scripts/questdb/init.sql:/init.sql:ro
    environment:
      PGPASSWORD: ${QUESTDB_PASSWORD:-quest}
    command: |
      sh -c '
      until pg_isready -h questdb -p 8812 -U admin; do
        echo "Waiting for QuestDB PgWire port..."
        sleep 1
      done
      echo "QuestDB PgWire is ready, running init.sql..."
      psql -h questdb -p 8812 -U admin -d qdb -f /init.sql
      '
    depends_on:
      questdb:
        condition: service_healthy

  postgres-integration:
    image: postgres:17-alpine
    profiles: [ "go-integration" ]
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: storefront_test
      POSTGRES_PASSWORD: storefront_test
      POSTGRES_DB: storefront_test
    networks:
      - private
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U storefront_test -d storefront_test" ]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-integration:
    image: redis:7-alpine
    profiles: [ "go-integration" ]
    ports:
      - "56379:6379"
    networks:
      - private
    tmpfs:
      - /data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 3s
      retries: 20

  nats-integration:
    image: nats:2.11.6-alpine
    profiles: [ "go-integration" ]
    command: [ "-js", "-sd", "/data", "-m", "8222" ]
    ports:
      - "54222:4222"
      - "58222:8222"
    networks:
      - private
    tmpfs:
      - /data

  minio-integration:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    profiles: [ "go-integration" ]
    command: [ "server", "/data", "--console-address", ":9001" ]
    ports:
      - "59000:9000"
      - "59001:9001"
    environment:
      MINIO_ROOT_USER: minio_test
      MINIO_ROOT_PASSWORD: minio_test_secret
    networks:
      - private
    tmpfs:
      - /data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null" ]
      interval: 2s
      timeout: 3s
      retries: 30

  questdb-integration:
    image: questdb/questdb:9.4.3
    profiles: [ "go-integration" ]
    ports:
      - "58812:8812"
      - "59003:9000"
    environment:
      QDB_PG_USER: admin
      QDB_PG_PASSWORD: quest
      QDB_TELEMETRY_ENABLED: "false"
      QDB_PG_NET_BIND_TO: 0.0.0.0:8812
      QDB_HTTP_BIND_TO: 0.0.0.0:9000
    networks:
      - private
    tmpfs:
      - /var/lib/questdb
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9003/status >/dev/null" ]
      interval: 3s
      timeout: 3s
      retries: 30

  trading-core:
    <<: *rust-service
    depends_on:
      redis:
        condition: service_healthy
      questdb-schema-init:
        condition: service_completed_successfully
    image: ${TRADING_IMAGE_REGISTRY:-trading}/trading-core:${IMAGE_TAG:-development}
    build:
      context: ..
      dockerfile: ops/deployment/Dockerfile
      args:
        BIN: trading-core
    volumes:
      - type: bind
        source: ./config/${TRADING_CONFIG_PROFILE:-system.json}
        target: /workspace/ops/config/system.json
        read_only: true
      - type: bind
        source: ./config/risk_limits.toml
        target: /workspace/ops/config/risk_limits.toml
        read_only: true
    environment:
      <<: *rust-env
      SERVICE_NAME: trading-core
      TRADING_CORE_METRICS_HOST: 0.0.0.0
      TRADING_CORE_METRICS_PORT: 9090
      QUESTDB_ILP_ADDR: questdb:9009
      HEALTHCHECK_URL: http://127.0.0.1:9090/metrics
      MARKET_DATA_METRICS_URL: http://127.0.0.1:9090/metrics
      EXECUTION_METRICS_URL: http://127.0.0.1:9090/metrics
      RISK_METRICS_URL: http://127.0.0.1:9090/metrics
      GO_CONTROL_PLANE_URL: http://gateway:8081
      INTEGRITY_MAX_PNL_DRIFT_PCT: ${INTEGRITY_MAX_PNL_DRIFT_PCT:-0.10}
      INTEGRITY_MAX_EXPOSURE_DRIFT_BPS: ${INTEGRITY_MAX_EXPOSURE_DRIFT_BPS:-5.0}
      INTEGRITY_MAX_LATENCY_REGRESSION_RATIO: ${INTEGRITY_MAX_LATENCY_REGRESSION_RATIO:-1.50}
      INTEGRITY_ALLOW_FALLBACKS: ${INTEGRITY_ALLOW_FALLBACKS:-false}
      INTEGRITY_ALLOW_RECONCILIATION_FAILURES: ${INTEGRITY_ALLOW_RECONCILIATION_FAILURES:-false}
    ports:
      - "${MARKET_DATA_PORT:-5555}:5555"
      - "${TRADING_CORE_METRICS_PORT:-9090}:9090"
    labels:
      com.rustalgorithmtrading.role: private-trading-core
      com.rustalgorithmtrading.audience: trader

  signal-bridge:
    <<: *rust-service
    image: ${TRADING_IMAGE_REGISTRY:-trading}/signal-bridge:${IMAGE_TAG:-development}
    build:
      context: ..
      dockerfile: ops/deployment/Dockerfile
      args:
        BIN: signal-bridge
    environment:
      <<: *rust-env
      SERVICE_NAME: signal-bridge
      SIGNAL_BRIDGE_METRICS_HOST: 0.0.0.0
      HEALTHCHECK_URL: http://127.0.0.1:9094/metrics
    ports:
      - "${SIGNAL_BRIDGE_PORT:-5556}:5556"
      - "${SIGNAL_BRIDGE_METRICS_PORT:-9094}:9094"
    depends_on:
      trading-core:
        condition: service_healthy
    labels:
      com.rustalgorithmtrading.role: private-signal-engine
      com.rustalgorithmtrading.audience: trader

  gateway:
    image: ${TRADING_IMAGE_REGISTRY:-trading}/gateway:${IMAGE_TAG:-development}
    build:
      context: ..
      dockerfile: ops/deployment/gateway.Dockerfile
    restart: unless-stopped
    init: true
    networks:
      - public
      - private
    volumes:
      - edge-artifact-data:/var/lib/lepos
    environment:
      <<: *saas-env
      SERVICE_NAME: gateway
      GATEWAY_RUN_MODE: ${GATEWAY_RUN_MODE:-both}
      PORT: ${GATEWAY_PORT:-8081}
      EDGE_PORT: ${EDGE_PORT:-8088}
      TLS_PORT: ${TLS_PORT:-8443}
      HOST: ${GATEWAY_HOST:-0.0.0.0}
      HOSTNAME: ${GATEWAY_HOST_ID:-gateway}
      DATABASE_URL: ${DATABASE_URL:-}
      QUESTDB_PG_URL: postgresql://admin:${QUESTDB_PASSWORD:-quest}@questdb:8812/qdb
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NATS_URL: ${NATS_URL:-}
      NATS_STREAM_NAME: ${NATS_STREAM_NAME:-CONTROL_GATEWAY_EVENTS}
      NATS_SUBJECT_PREFIX: ${NATS_SUBJECT_PREFIX:-control-gateway}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-2s}
      OUTBOX_LEASE_TTL: ${OUTBOX_LEASE_TTL:-30s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      ALPACA_DATA_BASE_URL: ${ALPACA_DATA_BASE_URL:-https://data.alpaca.markets}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      QUANTANT_ENABLED: ${QUANTANT_ENABLED:-false}
      QUANTANT_LIVE_ENABLED: ${QUANTANT_LIVE_ENABLED:-false}
      QUANTANT_STRATEGY_LIVE_ENABLED: ${QUANTANT_STRATEGY_LIVE_ENABLED:-false}
      QUANTANT_COMMAND_STREAM: ${QUANTANT_COMMAND_STREAM:-QUANTANT_COMMANDS}
      QUANTANT_EXECUTION_SUBJECT: ${QUANTANT_EXECUTION_SUBJECT:-quantant.execution}
      QUANTANT_LIVE_SESSION_TTL: ${QUANTANT_LIVE_SESSION_TTL:-15m}
      TELEMETRY_API_KEY: ${TELEMETRY_API_KEY:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-control-gateway}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      MARKET_DATA_METRICS_URL: http://trading-core:9090/metrics
      EXECUTION_METRICS_URL: http://trading-core:9090/metrics
      RISK_METRICS_URL: http://trading-core:9090/metrics
      LEPOS_STORAGE_ROOT: /var/lib/lepos/artifacts
      LEPOS_CONTROL_PLANE_URL: http://nextjs-frontend:3000
      GO_CONTROL_PLANE_PUBLIC_URL: ${GO_CONTROL_PLANE_PUBLIC_URL:-http://localhost:8081}
      LEPOS_SCHEDULER_ENABLED: ${LEPOS_SCHEDULER_ENABLED:-true}
      TELEMETRY_DEVICE_PEPPER: ${TELEMETRY_DEVICE_PEPPER:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      LEPOS_ARTIFACT_PROVIDER: ${LEPOS_ARTIFACT_PROVIDER:-s3}
      LEPOS_ARTIFACT_BUCKET: ${LEPOS_ARTIFACT_BUCKET:-lepoship-artifacts}
      LEPOS_ARTIFACT_PUBLIC_URL: ${LEPOS_ARTIFACT_PUBLIC_URL:-}
      LEPOS_ARTIFACT_ENDPOINT: ${LEPOS_ARTIFACT_ENDPOINT:-}
      LEPOS_ARTIFACT_REGION: ${LEPOS_ARTIFACT_REGION:-auto}
      LEPOS_ARTIFACT_ACCESS_KEY_ID: ${LEPOS_ARTIFACT_ACCESS_KEY_ID:-}
      LEPOS_ARTIFACT_SECRET_ACCESS_KEY: ${LEPOS_ARTIFACT_SECRET_ACCESS_KEY:-}
      LEPOS_ARTIFACT_FORCE_PATH_STYLE: ${LEPOS_ARTIFACT_FORCE_PATH_STYLE:-false}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      STOREFRONT_API_ENABLED: ${STOREFRONT_API_ENABLED:-false}
      STOREFRONT_MOCK_PAYMENTS_ENABLED: ${STOREFRONT_MOCK_PAYMENTS_ENABLED:-false}
      STOREFRONT_JWT_SECRET: ${STOREFRONT_JWT_SECRET:-}
      STOREFRONT_JWT_ISSUER: ${STOREFRONT_JWT_ISSUER:-control-gateway}
      STOREFRONT_JWT_AUDIENCE: ${STOREFRONT_JWT_AUDIENCE:-ios-storefront}
      STOREFRONT_ACCESS_TTL: ${STOREFRONT_ACCESS_TTL:-15m}
      STOREFRONT_REFRESH_TTL: ${STOREFRONT_REFRESH_TTL:-720h}
      LEPOS_CRON_BUNDLE_ABUSE: ${LEPOS_CRON_BUNDLE_ABUSE:-}
      LEPOS_CRON_RETENTION: ${LEPOS_CRON_RETENTION:-}
      LEPOS_CRON_AB_EXPERIMENTS: ${LEPOS_CRON_AB_EXPERIMENTS:-}
      LEPOS_CRON_RANKING: ${LEPOS_CRON_RANKING:-}
      LEPOS_CRON_BUNDLE_WEBHOOKS: ${LEPOS_CRON_BUNDLE_WEBHOOKS:-}
      LEPOS_CRON_WEBHOOK_RETRY: ${LEPOS_CRON_WEBHOOK_RETRY:-}
      LEPOS_CRON_SSL_RENEW: ${LEPOS_CRON_SSL_RENEW:-}
      LEPOS_CRON_OUTBOX: ${LEPOS_CRON_OUTBOX:-}
      LEPOS_CRON_RECONCILE: ${LEPOS_CRON_RECONCILE:-}
      LEPOS_CRON_CLEANUP_PREVIEWS: ${LEPOS_CRON_CLEANUP_PREVIEWS:-}
      LEPOS_CRON_CLEANUP_WAF: ${LEPOS_CRON_CLEANUP_WAF:-}
      LEPOS_CRON_SYNC_STORAGE: ${LEPOS_CRON_SYNC_STORAGE:-}
      LEPOS_PREVIEW_CLEANUP_ADAPTER_URL: ${LEPOS_PREVIEW_CLEANUP_ADAPTER_URL:-}
      LEPOS_PREVIEW_CLEANUP_ADAPTER_TOKEN: ${LEPOS_PREVIEW_CLEANUP_ADAPTER_TOKEN:-}
      LEPOS_CLEANUP_PREVIEWS_WITHOUT_ADAPTER: ${LEPOS_CLEANUP_PREVIEWS_WITHOUT_ADAPTER:-false}
      LEPOS_STORAGE_SYNC_ADAPTER_URL: ${LEPOS_STORAGE_SYNC_ADAPTER_URL:-}
      LEPOS_STORAGE_SYNC_ADAPTER_TOKEN: ${LEPOS_STORAGE_SYNC_ADAPTER_TOKEN:-}
      LEPOS_SSL_RENEWAL_ADAPTER_URL: ${LEPOS_SSL_RENEWAL_ADAPTER_URL:-}
      LEPOS_SSL_RENEWAL_ADAPTER_TOKEN: ${LEPOS_SSL_RENEWAL_ADAPTER_TOKEN:-}
      LEPOS_INTERNAL_API_KEY: ${LEPOS_INTERNAL_API_KEY:-}
      LEPOS_SERVICE_ID: ${LEPOS_SERVICE_ID:-edge-gateway}
      LEPOS_SERVICE_SECRET: ${LEPOS_SERVICE_SECRET:-}
      LEPOS_IPFS_GATEWAY_URL: ${LEPOS_IPFS_GATEWAY_URL:-https://ipfs.io/ipfs}
      LEPOS_ARWEAVE_GATEWAY_URL: ${LEPOS_ARWEAVE_GATEWAY_URL:-https://arweave.net}
      LEPOS_CONTROL_PLANE_TLS_CERT: ${LEPOS_CONTROL_PLANE_TLS_CERT:-}
      LEPOS_CONTROL_PLANE_TLS_KEY: ${LEPOS_CONTROL_PLANE_TLS_KEY:-}
      LEPOS_CONTROL_PLANE_TLS_CA: ${LEPOS_CONTROL_PLANE_TLS_CA:-}
    ports:
      - "${CONTROL_PLANE_PORT:-8081}:8081"
      - "${EDGE_HTTP_PORT:-8088}:8088"
      - "${EDGE_TLS_PORT:-8443}:8443"
    depends_on:
      redis:
        condition: service_healthy
      questdb:
        condition: service_healthy
      trading-core:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health/ready >/dev/null || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 256M
    labels:
      com.rustalgorithmtrading.role: public-edge-gateway
      com.rustalgorithmtrading.audience: developer,trader,regular

  nextjs-frontend:
    image: ${TRADING_IMAGE_REGISTRY:-trading}/nextjs-frontend:${IMAGE_TAG:-development}
    build:
      context: ..
      dockerfile: ops/deployment/nextjs.Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    networks:
      - public
      - private
    environment:
      <<: *saas-env
      SERVICE_NAME: nextjs-frontend
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=1536
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GO_CONTROL_PLANE_URL: http://gateway:8081
      GO_CONTROL_PLANE_PUBLIC_URL: ${GO_CONTROL_PLANE_PUBLIC_URL:-http://localhost:8081}
      NEXT_PUBLIC_GO_CONTROL_PLANE_URL: ${GO_CONTROL_PLANE_PUBLIC_URL:-http://localhost:8081}
      LEPOS_SERVICE_ID: ${LEPOS_NEXT_SERVICE_ID:-nextjs-frontend}
      LEPOS_SERVICE_SECRET: ${LEPOS_SERVICE_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      APP_SECRETS_MASTER_KEY: ${APP_SECRETS_MASTER_KEY:-}
      AUDIT_LOG_KEY: ${AUDIT_LOG_KEY:-}
      LEPOS_INTERNAL_API_KEY: ${LEPOS_INTERNAL_API_KEY:-}
      LEPOS_NATIVE_TELEMETRY_KEY: ${LEPOS_NATIVE_TELEMETRY_KEY:-}
      LEPOS_NATIVE_TELEMETRY_KEY_VERSION: ${LEPOS_NATIVE_TELEMETRY_KEY_VERSION:-}
      LEPOS_WEBHOOK_SECRET: ${LEPOS_WEBHOOK_SECRET:-}
      LEPOS_PARTNER_API_KEY: ${LEPOS_PARTNER_API_KEY:-}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-}
      SCIM_BEARER_TOKEN: ${SCIM_BEARER_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      STRIPE_MARKETPLACE_WEBHOOK_SECRET: ${STRIPE_MARKETPLACE_WEBHOOK_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_CALLBACK_URL: ${GITHUB_APP_CALLBACK_URL:-}
      VERCEL_WEBHOOK_SECRET: ${VERCEL_WEBHOOK_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${NEXT_PUBLIC_FIREBASE_DATABASE_URL:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      EDGE_CONFIG: ${EDGE_CONFIG:-}
      LEPOS_CACHE_ACCESS_KEY_ID: ${LEPOS_CACHE_ACCESS_KEY_ID:-}
      LEPOS_CACHE_SECRET_ACCESS_KEY: ${LEPOS_CACHE_SECRET_ACCESS_KEY:-}
      LEPOS_CACHE_BUCKET: ${LEPOS_CACHE_BUCKET:-}
      LEPOS_CACHE_ENDPOINT: ${LEPOS_CACHE_ENDPOINT:-}
      LEPOS_CACHE_REGION: ${LEPOS_CACHE_REGION:-us-east-1}
      CRON_SECRET: ${CRON_SECRET:-}
      TELEMETRY_DEVICE_PEPPER: ${TELEMETRY_DEVICE_PEPPER:-}
      TELEMETRY_API_KEY: ${TELEMETRY_API_KEY:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      ALERT_DISCORD_WEBHOOK_URL: ${ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ACME_ACCOUNT_EMAIL: ${ACME_ACCOUNT_EMAIL:-}
