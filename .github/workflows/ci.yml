name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'python/**'
      - 'rust/**'
      - 'go/**'
      - 'nextjs/**'
      - 'ops/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'python/**'
      - 'rust/**'
      - 'go/**'
      - 'nextjs/**'
      - 'ops/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      go_next: ${{ steps.filter.outputs.go_next }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'python/**'
            rust:
              - 'rust/**'
            go_next:
              - 'go/**'
              - 'nextjs/**'
              - 'ops/**'

  # Python checks
  python:
    name: Python CI
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies & run checks
        working-directory: ./python
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          black --check src tests
          flake8 src tests --max-line-length=100
          pytest tests/unit tests/integration -q --tb=short

  # Rust checks
  rust:
    name: Rust CI
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format & Lint
        working-directory: ./rust
        run: |
          cargo fmt -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tests
        working-directory: ./rust
        run: cargo test --workspace

  # Go & Next.js codegen drift & tests
  ent-codegen-drift:
    name: Ent & Go/Next.js CI
    needs: changes
    if: ${{ needs.changes.outputs.go_next == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: nextjs/yarn.lock

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install Prisma generator dependencies
        working-directory: ./nextjs
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Test Prisma to Ent generator & Typecheck
        working-directory: ./nextjs
        run: |
          yarn test:ent-generator
          yarn typecheck

      - name: Regenerate Ent schema and client
        run: |
          cd nextjs
          yarn generate:ent
          cd ../go
          go generate ./internal/data/ent

      - name: Fail on generated drift
        run: git diff --exit-code -- go/internal/data/ent nextjs/tools/prisma-ent-generator nextjs/prisma/schema.prisma

      - name: Run Go tests
        working-directory: ./go
        run: |
          go test ./...
          go vet ./...
