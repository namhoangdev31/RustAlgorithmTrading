name: iOS AdaptiveSwiftUi Library CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'ios/Libraries/AdaptiveSwiftUi/**'
      - 'ios/iosApp/**'
      - 'ios/iosApp.xcodeproj/**'
      - 'ios/scripts/ios/package_ci.sh'
      - '.github/workflows/ios-adaptive-swiftui.yml'
  push:
    branches: [main, develop]
    tags:
      - 'v*'
    paths:
      - 'ios/Libraries/AdaptiveSwiftUi/**'
      - 'ios/iosApp/**'
      - 'ios/iosApp.xcodeproj/**'
      - 'ios/scripts/ios/package_ci.sh'
      - '.github/workflows/ios-adaptive-swiftui.yml'
  workflow_dispatch:

concurrency:
  group: adaptive-swiftui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint-and-check:
    name: Lint & Structure Checks
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: SwiftFormat Check (if config exists)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ios/.swiftformat || -f .swiftformat ]]; then
            brew install swiftformat
            swiftformat --lint ios/Libraries/AdaptiveSwiftUi/Sources ios/Libraries/AdaptiveSwiftUi/Tests
          fi

      - name: Compatibility Enforcement
        shell: bash
        run: |
          set -euo pipefail
          if rg -n "func (adaptiveGlass|adaptiveGlassButton|adaptiveBackgroundExtension|adaptiveTabBarMinimizeOnScroll|glassEffect|liquidGlass|liquidGlassButton)\\b|struct (AdaptiveGlassContainer|LiquidGlassModifier|LiquidGlassButtonModifier)\\b|enum AdaptiveGlassButtonVariant\\b" ios/iosApp/DesignSystem 2>/dev/null; then
            echo "::error::Legacy compatibility wrappers still exist in iosApp/DesignSystem. Use AdaptiveSwiftUi package as source-of-truth."
            exit 1
          fi

          if rg -n "\\.(glassEffect|liquidGlass|liquidGlassButton|interactiveDismissDisabled|navigationSubtitle)\\s*\\(|\\.tabViewStyle\\s*\\(\\s*PageTabViewStyle|\\.tabBarMinimizeBehavior\\s*\\(" ios/iosApp/Views 2>/dev/null; then
            echo "::error::Raw compatibility APIs are still used in iosApp/Views. Migrate to AdaptiveSwiftUi adaptive* APIs."
            exit 1
          fi

          missing=0
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            if ! rg -q "^import AdaptiveSwiftUi$" "${file}"; then
              echo "::error file=${file}::Missing direct import AdaptiveSwiftUi for adaptive* call-site."
              missing=1
            fi
          done < <(rg -l "\\.adaptive[A-Z][A-Za-z0-9_]*\\(" ios/iosApp/Views 2>/dev/null || true)

          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

  swift-test-and-build:
    name: Test & Integration Build
    runs-on: macos-latest
    needs: lint-and-check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Run Swift Package Tests
        working-directory: ios/Libraries/AdaptiveSwiftUi
        shell: bash
        run: |
          set -euo pipefail
          swift test

      - name: Integration Compile iosApp
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  release:
    name: Tagged Release
    runs-on: macos-latest
    needs: swift-test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Create Release Tarball
        shell: bash
        run: |
          set -euo pipefail
          tar -czf adaptive-swiftui-${GITHUB_REF_NAME}.tar.gz -C ios/Libraries/AdaptiveSwiftUi Sources Tests Package.swift

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            adaptive-swiftui-${{ github.ref_name }}.tar.gz
